name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@v4
      - name: Install official MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/moon-install.sh
          bash /tmp/moon-install.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record toolchain
        run: moon version --all
      - name: Compiler unit tests examples and CLI acceptance
        run: python3 scripts/verify.py --target ${{ matrix.target }}
